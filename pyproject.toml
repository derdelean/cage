[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "cage-ai"
version = "0.1.2"
description = "CAGE: credential containment for AI agents. Capability-token-gated, structurally refusing, audit-chained."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Dennis Erdelean", email = "dennis.erdelean@gmail.com" }
]
keywords = ["security", "cryptography", "ai-agents", "capability-tokens"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.11"
# The pure-Python core (cage.core.Gate + CapabilityToken) carries no runtime
# third-party dependency — secret custody and transport are optional rings below.
dependencies = []

[project.urls]
Homepage = "https://github.com/derdelean/cage"
Repository = "https://github.com/derdelean/cage"
Issues = "https://github.com/derdelean/cage/issues"

[project.optional-dependencies]
# Secret-custody ring (cage.vault) on the pure-Python fallback backend.
# Production uses the maturin-built Rust extension, which needs none of these;
# the extra only covers the dependency-light dev fallback.
vault = ["cryptography>=42"]
# Zero-plaintext LLM transport on the Python fallback (the Rust ext is preferred).
anthropic = ["httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "maturin>=1.7",
    "ruff>=0.6",
    "cryptography>=42",
    "httpx>=0.27",
]

[tool.maturin]
module-name = "cage._cage_native"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
