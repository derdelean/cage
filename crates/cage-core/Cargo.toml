[package]
name = "cage-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Dennis Erdelean <dennis.erdelean@gmail.com>"]
description = "CAGE core — pure-Rust credential vault, capability gating, append-only audit chain, and zero-plaintext transport. The single audited core shared by the PyO3 extension and the credential broker."

[dependencies]
chacha20poly1305 = { version = "0.10", features = ["std"] }
zeroize = { version = "1.8", features = ["derive"] }
# OsRng only. Not rand: its thread_rng and StdRng keep their output in a heap
# block that is never locked or wiped, so a copy of every key would stay there.
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
subtle = "2.6"
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
base64 = "0.23"

# HTTPS transport — rustls + tokio-rustls only; no reqwest/hyper.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
once_cell = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
