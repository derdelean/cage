# Version updates for the three places dependencies are pinned: the action
# SHAs in .github/workflows/, Cargo.lock and uv.lock. Dependabot waits seven
# days after a release before it proposes the update, so a compromised release
# has time to be caught and yanked first. Security updates for known
# advisories come without that delay.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
