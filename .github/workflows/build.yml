name: build

on:
  pull_request:
  push:
    branches: [main]

# Every job here only reads the code. The repository default is read-only as
# well, and this block keeps the workflow read-only if that default changes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup ships with the runner. With no argument it installs the toolchain
      # rust-toolchain.toml pins, so a local `cargo clippy` is the same check as
      # this one. Bump the version there and nowhere else. --no-self-update keeps
      # the runner's rustup as it is instead of downloading the newest one.
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      # The uv version is pinned because setup-uv checks the download against a
      # checksum built into this pinned action, and it only knows versions up
      # to its own release.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          enable-cache: true

      # Installs the versions and hashes recorded in uv.lock. --locked fails the
      # run if uv.lock is out of date with pyproject.toml.
      - name: Install dev deps (locked)
        run: uv sync --locked --extra dev --no-install-project --python "$PYTHON_VERSION"

      - name: Build Rust extension (release)
        run: |
          source .venv/bin/activate
          maturin develop --release --locked

      - name: Cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: |
          source .venv/bin/activate
          cargo clippy --workspace --all-targets --locked -- -D warnings

      # The PyO3 binding crate has no Rust tests. pytest covers it.
      - name: Cargo test
        run: cargo test --workspace --exclude cage --locked

      - name: Pytest
        run: |
          source .venv/bin/activate
          pytest -v

  # Checks every crate in Cargo.lock against the RustSec advisory database,
  # refuses crates from anywhere but crates.io, and checks licenses. deny.toml
  # holds the rules.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: "0.20.2"
      # GitHub's digest for cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install cargo-deny (checksum-verified release binary)
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-deny" "$RUNNER_TEMP/cargo-deny"

      - name: cargo deny check
        run: '"$RUNNER_TEMP/cargo-deny" --locked check'

  # Static analysis of these workflows: unpinned actions, template injection,
  # credentials left in checkouts, permissions wider than a job needs. zizmor
  # comes from uv.lock with its hash checked.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Install zizmor (locked)
        run: uv sync --locked --only-group audit --no-install-project

      # The read-only token lets zizmor check each pinned commit against the
      # action's own repository and its known advisories.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/zizmor --persona=regular .github/workflows/
