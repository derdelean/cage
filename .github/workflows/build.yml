name: build

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-06-15
        with:
          # Keep in lockstep with rust-toolchain.toml — that file is what makes a
          # local `cargo clippy` the same check as this one. Bump both together.
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dev deps
        run: |
          source .venv/bin/activate
          uv pip install maturin pytest pytest-asyncio cryptography httpx

      - name: Build Rust extension (release)
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: |
          source .venv/bin/activate
          cargo clippy --workspace --all-targets -- -D warnings

      # The PyO3 binding crate has no Rust tests. pytest covers it.
      - name: Cargo test
        run: cargo test --workspace --exclude cage

      - name: Pytest
        run: |
          source .venv/bin/activate
          pytest -v
