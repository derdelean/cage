name: release

# Sigstore-signed release pipeline.
#
# When a tag v* is pushed:
#   1. Build manylinux + macOS wheels via maturin (Python 3.11–3.14)
#   2. Sign every wheel via cosign with GitHub Actions OIDC + Fulcio
#      (keyless — no long-lived signing keys live in this repo or in CI)
#   3. Publish a GitHub Release with the wheels alongside their .sig + .cert files
#   4. Each signature is anchored automatically in the public Sigstore Rekor
#      transparency log; verification proves the wheel was built by THIS
#      repository's release.yml at the tagged commit.
#
# Narrative consistency: cage proposes credential containment via
# capability tokens + audit chain. Our own releases are signed via the
# same Sigstore/Fulcio/Rekor model — "we sign our releases via the same
# infrastructure we propose for protecting your agents."

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write    # publish GitHub Releases
  id-token: write    # OIDC token for cosign keyless signing

jobs:
  build-wheels:
    name: build wheel (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-06-15
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install maturin
        run: |
          source .venv/bin/activate
          uv pip install maturin

      - name: Build wheel (manylinux on Linux)
        if: runner.os == 'Linux'
        run: |
          source .venv/bin/activate
          maturin build --release --strip --manylinux 2_28 -i python${{ matrix.python-version }}

      - name: Build wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          source .venv/bin/activate
          maturin build --release --strip -i python${{ matrix.python-version }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: target/wheels/*.whl
          if-no-files-found: error

  sign-and-release:
    name: sign + release
    needs: build-wheels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: wheel-*
          merge-multiple: true

      - name: List downloaded wheels
        run: ls -la artifacts/

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.4.1

      - name: Sign wheels (keyless, OIDC → Fulcio → Rekor)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          mkdir -p signed
          for wheel in artifacts/*.whl; do
            base=$(basename "$wheel")
            echo "Signing $base"
            cosign sign-blob --yes \
              --output-signature  "signed/${base}.sig" \
              --output-certificate "signed/${base}.cert" \
              "$wheel"
            cp "$wheel" "signed/"
          done
          ls -la signed/

      - name: Verify signatures locally (sanity check)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for wheel in signed/*.whl; do
            base=$(basename "$wheel")
            echo "Verifying $base"
            cosign verify-blob \
              --certificate       "signed/${base}.cert" \
              --signature         "signed/${base}.sig" \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$wheel"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body: |
            CAGE ${{ github.ref_name }} — Sigstore-signed release.

            Every wheel below is signed via Sigstore (keyless OIDC + Fulcio),
            with the signature anchored in the public Rekor transparency log.

            **Verify before installing:**

            ```bash
            cosign verify-blob \
              --certificate cage-*.whl.cert \
              --signature   cage-*.whl.sig \
              --certificate-identity-regexp \
                "https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@.*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              cage-*.whl
            ```

            A passing verification proves this wheel was built by this
            repository's release workflow at the tagged commit, recorded in
            Rekor.
          files: |
            signed/*.whl
            signed/*.sig
            signed/*.cert
          fail_on_unmatched_files: true
